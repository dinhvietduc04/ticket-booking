name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatly
          POSTGRES_PASSWORD: seatly
          POSTGRES_DB: seatly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatly -d seatly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://seatly:seatly@localhost:5432/seatly?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @ticket-booking/api exec prisma migrate deploy --schema prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter @ticket-booking/api test

      - name: Build
        run: pnpm build

      - name: Install browser for E2E tests
        run: pnpm --filter @ticket-booking/web exec playwright install --with-deps chromium

      - name: Browser E2E tests
        run: pnpm --filter @ticket-booking/web test:e2e
