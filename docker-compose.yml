services:
  postgres:
    image: postgres:16-alpine
    container_name: seatly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatly
      POSTGRES_PASSWORD: seatly
      POSTGRES_DB: seatly
    ports:
      - "5432:5432"
    volumes:
      - seatly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatly -d seatly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seatly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: seatly-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  seatly-postgres-data:
